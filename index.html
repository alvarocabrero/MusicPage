<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arte Kills · Música</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;500;800;900&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
<style>
:root{--rojo:#e22c14;--gris:#b6bbbf;--fondo:#fff;--tinta:#000;--sobre-rojo:#fff;--logo-l:block;--logo-d:none;
--display:"Raleway","Helvetica Neue",Arial,sans-serif;--texto:"Merriweather",Georgia,"Times New Roman",serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fondo:#000;--tinta:#fff;--logo-l:none;--logo-d:block}}
:root[data-theme="dark"]{--fondo:#000;--tinta:#fff;--logo-l:none;--logo-d:block}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
body{margin:0;background:var(--fondo);color:var(--tinta);font:300 1rem/1.75 var(--texto)}
h1,h2,h3{font-family:var(--display);font-weight:900;margin:0;line-height:1}
a{color:inherit}
:focus-visible{outline:3px solid var(--tinta);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.lg{height:100%;width:auto;aspect-ratio:var(--r)}
.l-l{display:var(--logo-l)}.l-d{display:var(--logo-d)}
/* cabecera */
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;background:var(--fondo);border-bottom:4px solid var(--tinta);transition:background-color .25s,border-color .25s}
.top .brand{transition:opacity .25s,visibility .25s}
.top nav a{transition:color .25s}
.top.at-top{background:transparent;border-bottom-color:transparent}
.top.at-top .brand{opacity:0;visibility:hidden}
.top.at-top nav a{color:#000}
.top.at-top nav a:hover{color:var(--rojo)}
@media (prefers-reduced-motion:reduce){.top,.top .brand,.top nav a{transition:none}}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.top .brand{height:54px;display:block}
nav{display:flex;gap:26px;align-items:center;font:800 .95rem var(--display)}
nav a{text-decoration:none}
nav a:hover{color:var(--rojo)}
/* portada */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#lanzamientos{border-top:0}
.hero .mark{background:#fff;border-bottom:10px solid var(--tinta);padding:128px 24px 56px}
.hero .mk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px clamp(24px,5vw,64px);align-items:center;max-width:1180px;margin:0 auto}
.hero .mk .lg{display:block;width:100%;max-width:440px;height:auto;justify-self:center}
.hrel{--tinta:#000;--fondo:#fff;color:#000}
.hrel h2{font-size:clamp(1.8rem,4vw,2.6rem);text-transform:uppercase;letter-spacing:-.01em}
.hrel .hm{margin:8px 0 14px;font:500 .95rem/1.4 var(--display)}
.hrel .hp iframe{display:block;width:100%;height:352px;border:0;border-radius:12px}
.hrel .plats{padding:14px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hrel .plats li+li{margin:0}
.hrel .plats a{padding:10px 12px;font-size:.95rem}
.hrel .plats span{display:none}
@media (max-width:820px){.hero .mk{grid-template-columns:1fr}.hero .mk .lg{max-width:300px}}
.hero .intro{display:flex;flex-wrap:wrap;gap:24px 48px;align-items:center;justify-content:space-between;padding-top:40px;padding-bottom:48px}
.dash{display:block;width:44px;height:6px;background:var(--rojo);margin:0 0 18px}
.hero p{max-width:46ch;margin:0}
section .dash{margin:22px 0}
.btn{display:inline-block;background:var(--rojo);color:var(--sobre-rojo);border:3px solid var(--rojo);padding:12px 26px;font:800 1rem var(--display);text-decoration:none}
.btn:hover{background:var(--tinta);border-color:var(--tinta);color:var(--fondo)}
.btn.alt{background:none;color:var(--tinta);border-color:var(--tinta);margin-left:10px}
.btn.alt:hover{background:var(--tinta);color:var(--fondo)}
/* secciones */
section{padding:84px 0;border-top:4px solid var(--tinta)}
section h2{font-size:clamp(2.2rem,6vw,4rem);text-transform:uppercase;letter-spacing:-.01em}
section .sub{font-weight:300;font-style:italic;margin:0 0 40px;max-width:60ch}
.releases{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:32px}
.cover{aspect-ratio:1;border:4px solid var(--tinta);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:16px;margin-bottom:14px;font:900 clamp(1.5rem,3.2vw,2.1rem)/.98 var(--display);text-transform:uppercase;letter-spacing:-.01em}
.cover:before{content:"";position:absolute;inset:0;background:radial-gradient(circle,currentColor 1.6px,#0000 2.2px) 0 0/9px 9px;opacity:.22;-webkit-mask:linear-gradient(200deg,#000 0,#0000 55%);mask:linear-gradient(200deg,#000 0,#0000 55%)}
.cover span{position:relative}
.cover .cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover.hasimg:before,.cover.hasimg span{display:none}
.c0{background:var(--rojo);color:#fff}.c1{background:#000;color:#fff}.c2{background:var(--gris);color:#000}.c3{background:#fff;color:var(--rojo)}
.rel{display:flex;flex-direction:column;align-items:flex-start}
.rel .cover{width:100%}
.rel .meta{margin-bottom:12px}
.rel .abrir{margin-top:auto}
.rel h3{font:800 1.1rem/1.3 var(--display)}
.rel .meta{font:500 .9rem/1.5 var(--display);margin-top:4px}
.tipo{display:inline-block;border:2px solid var(--tinta);padding:0 10px;font:800 .8rem/1.6 var(--display);margin-bottom:8px}
.lnk{display:inline-block;margin-top:8px;font:800 .95rem var(--display);color:var(--rojo);text-decoration-thickness:3px;text-underline-offset:4px}
.vids{list-style:none;margin:0;padding:0;border-top:4px solid var(--tinta)}
.vids li{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:18px 0;border-bottom:2px solid var(--tinta)}
.vids b{font:800 clamp(1.05rem,2.4vw,1.4rem) var(--display)}
.vids a{font:800 .95rem var(--display);color:var(--rojo);white-space:nowrap}
/* merch */
#merch .hd{display:flex;justify-content:space-between;align-items:center;gap:16px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:32px}
.mi{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.mi .mp{display:block;width:100%;aspect-ratio:1;border:4px solid var(--tinta);background:var(--gris);overflow:hidden}
.mi .mp img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 40%;transition:transform .4s}
.mi a.mp:hover img{transform:scale(1.04)}
.mi h3{font:800 1.15rem/1.25 var(--display)}
.mi .pr{font:500 .95rem var(--display)}
.mi .mt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;margin:4px 0 8px}
.mi .mt button{padding:0;border:3px solid var(--tinta);background:none;cursor:pointer;aspect-ratio:1;overflow:hidden;opacity:.6}
.mi .mt button.on,.mi .mt button:hover{opacity:1;border-color:var(--rojo)}
.mi .mt img{display:block;width:100%;height:100%;object-fit:cover}
.mi .me{margin:0;font:800 .8rem/1.4 var(--display)}
.mi .md{margin:0;font:300 .9rem/1.5 var(--texto)}
.mi .abrir{text-decoration:none}
.mnone{grid-column:1/-1;border:4px solid var(--tinta);padding:40px 24px;font:800 clamp(1.4rem,3vw,2rem)/1.2 var(--display);text-transform:uppercase}
.mnone span{display:block;margin-top:8px;font:500 .95rem/1.5 var(--display);text-transform:none}
/* popup */
.rel .cover{width:100%;cursor:pointer;text-align:left;color:inherit;font-family:var(--display);border:4px solid var(--tinta)}
.rel .cover:hover{outline:4px solid var(--rojo);outline-offset:0}
.abrir{display:inline-block;margin-top:10px;background:var(--rojo);color:#fff;border:3px solid var(--rojo);padding:7px 16px;font:800 .9rem var(--display);cursor:pointer}
.abrir:hover{background:var(--tinta);border-color:var(--tinta);color:var(--fondo)}
dialog{border:0;background:none;color:var(--tinta);padding:0;width:min(560px,calc(100% - 24px));max-height:none;overflow:visible}
.dbox{border:4px solid var(--tinta);background:var(--fondo);max-height:calc(100dvh - 24px);overflow:auto}
.nv{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;border:4px solid var(--tinta);background:var(--fondo);color:var(--tinta);font:800 2.2rem/1 var(--display);padding:0 0 6px;cursor:pointer}
.nv:hover{background:var(--rojo);border-color:var(--rojo);color:#fff}
.nv-p{right:calc(100% + 12px)}.nv-n{left:calc(100% + 12px)}
@media (max-width:700px){.nv{top:calc(100% + 12px);transform:none;width:64px;height:48px;padding:0 0 4px}.nv-p{right:auto;left:0}.nv-n{left:auto;right:0}}
dialog::backdrop{background:#000b}
.dh{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:20px 20px 16px;border-bottom:4px solid var(--tinta)}
.dh h3{font-size:1.7rem;text-transform:uppercase;letter-spacing:-.01em}
.dh p{margin:6px 0 0;font:500 .9rem/1.4 var(--display)}
.dx{flex:none;background:var(--tinta);color:var(--fondo);border:0;width:40px;height:40px;font:800 1.4rem var(--display);cursor:pointer}
.dx:hover{background:var(--rojo);color:#fff}
.dp{padding:16px 20px 0}
.dp iframe{display:block;width:100%;height:152px;border:0;border-radius:12px}
@media (min-height:880px){.dp iframe{height:352px}}
.dp small{display:block;margin:8px 0 0;font:italic 300 .8rem/1.5 var(--texto)}
.plats{list-style:none;margin:0;padding:16px 20px 20px}
.plats li+li{margin-top:8px}
.plats a{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 14px;border:3px solid var(--tinta);text-decoration:none;font:800 1.05rem var(--display)}
.plats b{display:flex;align-items:center;gap:10px;font:inherit}.plats svg{width:26px;height:26px;flex:none;fill:currentColor}
.plats a:hover{background:var(--tinta);color:var(--fondo)}
.plats a.dir{background:var(--rojo);border-color:var(--rojo);color:#fff}
.plats a.dir:hover{background:var(--tinta);border-color:var(--tinta)}
.plats span{font:500 .8rem var(--display)}
/* vídeos */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:32px}
.vid{border:4px solid var(--tinta);background:var(--fondo);display:flex;flex-direction:column}
.vid .vcap{flex:1}
.vbtn{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:0;background:#000;cursor:pointer;overflow:hidden}
.vbtn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vbtn .play{position:absolute;left:50%;top:50%;width:76px;height:76px;transform:translate(-50%,-50%);background:var(--rojo);display:grid;place-items:center;border:4px solid #000}
.vbtn .play:after{content:"";border-style:solid;border-width:14px 0 14px 24px;border-color:#0000 #0000 #0000 #fff;margin-left:6px}
.vbtn:hover .play{background:#fff}
.vbtn:hover .play:after{border-left-color:var(--rojo)}
.vid iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
.vcap{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 14px;border-top:4px solid var(--tinta)}
.vcap b{font:800 1.05rem/1.2 var(--display)}
.vcap a{font:800 .85rem var(--display);color:var(--rojo);white-space:nowrap}
/* carrusel */
.car{container-type:inline-size;position:relative;width:100vw;margin-left:calc(50% - 50vw)}
body{overflow-x:clip}
.track{--iw:min(660px,62cqw);--ov:26px;position:relative;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px calc((100cqw - var(--iw))/2 + var(--ov));scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.track:focus-visible{outline:3px solid var(--tinta);outline-offset:4px}
.slide{flex:0 0 var(--iw);min-width:0;margin-inline:calc(var(--ov) * -1);scroll-snap-align:center;scroll-snap-stop:always;background:var(--fondo);border:4px solid var(--tinta);will-change:transform,filter,opacity}
.slide:not(.active){cursor:pointer}
.rs{display:grid;grid-template-columns:1fr 1fr}
.rs .cover{aspect-ratio:1;width:100%;margin:0;border:0;border-right:4px solid var(--tinta);cursor:pointer;text-align:left}
.rs .info{padding:24px;display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.rs h3{font:800 1.35rem/1.25 var(--display)}
.rs .meta{font:500 .95rem/1.5 var(--display);margin:8px 0 18px}
.rs .abrir,.rs .lnk{margin-top:auto}
.vbtn{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:0;background:#000;cursor:pointer;overflow:hidden}
.vbtn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vbtn .play{position:absolute;left:50%;top:50%;width:76px;height:76px;transform:translate(-50%,-50%);background:var(--rojo);display:grid;place-items:center;border:4px solid #000}
.vbtn .play:after{content:"";border-style:solid;border-width:14px 0 14px 24px;border-color:#0000 #0000 #0000 #fff;margin-left:6px}
.vbtn:hover .play{background:#fff}
.vbtn:hover .play:after{border-left-color:var(--rojo)}
.vs iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
.vs:not(.active) iframe{pointer-events:none}
.vcap{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 14px;border-top:4px solid var(--tinta)}
.vcap b{font:800 1.05rem/1.2 var(--display)}
.vcap a{font:800 .85rem var(--display);color:var(--rojo);white-space:nowrap}
.ctrl{display:flex;justify-content:space-between;align-items:center;margin:28px auto 0;max-width:1180px;padding-inline:24px}
.count{font:800 1rem var(--display)}
.btns{display:flex;gap:8px}
.btns button{width:52px;height:52px;padding:0;border:3px solid var(--tinta);background:var(--fondo);color:var(--tinta);cursor:pointer;display:grid;place-items:center}
.btns button:hover:not(:disabled){background:var(--tinta);color:var(--fondo)}
.btns button:disabled{opacity:.3;cursor:not-allowed}
.btns svg{width:22px;height:22px}
@media (max-width:820px){.track{--iw:72cqw;--ov:18px}.rs{grid-template-columns:1fr}.rs .cover{border-right:0;border-bottom:4px solid var(--tinta)}.rs .info{padding:18px}}
/* ver todos */
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px}
.vt{border:3px solid var(--tinta);background:none;color:var(--tinta);padding:9px 20px;font:800 .95rem var(--display);cursor:pointer}
.vt:hover{background:var(--tinta);color:var(--fondo)}
.car .lst{display:none;max-width:1180px;margin:0 auto;padding-inline:24px}
.car.all .stage,.car.all .ctrl{display:none}
.car.all .lst{display:block}
.lst .slide:first-child{border-top:4px solid var(--tinta)}
.lst .slide{margin:0;border:0;border-bottom:2px solid var(--tinta);padding:20px 0;background:none;cursor:auto}
.lst .rs{display:grid;grid-template-columns:min(200px,32%) 1fr;gap:28px;align-items:center}
.lst .rs .cover{border:4px solid var(--tinta);font-size:1.15rem;padding:10px}
.lst .rs .info{padding:0}
.lst .rs .abrir,.lst .rs .lnk{margin-top:0}
.lst .vs{display:grid;grid-template-columns:min(380px,42%) 1fr;gap:28px;align-items:center}
.lst .vs .vbtn,.lst .vs iframe{border:4px solid var(--tinta);pointer-events:auto}
.lst .vs .vcap{border-top:0;padding:0;flex-direction:column;align-items:flex-start;gap:8px}
.lst .vs .vcap b{font-size:1.3rem}
@media (max-width:820px){.lst .rs{grid-template-columns:96px 1fr;gap:16px}.lst .rs .cover span{display:none}.lst .vs{grid-template-columns:1fr;gap:12px}}
/* carrusel tipo escenario */
@property --sbg{syntax:"<color>";inherits:true;initial-value:#fff}
@property --sfg{syntax:"<color>";inherits:true;initial-value:#000}
#lanzamientos,#videoclips{--tinta:var(--sfg);--fondo:var(--sbg);background:var(--sbg);color:var(--sfg);transition:--sbg .7s ease,--sfg .7s ease}
section .dash{background:var(--dash,var(--rojo))}
.stage{position:relative;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;outline-offset:-4px}
.stage:focus-visible{outline:3px solid var(--tinta)}
.cd{position:absolute;top:30px;overflow:hidden;border-radius:14px;border:3px solid var(--tinta);box-shadow:0 18px 32px -16px rgba(0,0,0,.55);transition:left .7s cubic-bezier(.65,.05,.25,1),width .7s cubic-bezier(.65,.05,.25,1),filter .35s;will-change:left,width}
.cd:before{content:"";position:absolute;inset:0;background:radial-gradient(circle,currentColor 1.6px,#0000 2.2px) 0 0/9px 9px;opacity:.2;-webkit-mask:linear-gradient(200deg,#000 0,#0000 60%);mask:linear-gradient(200deg,#000 0,#0000 60%)}
.stage.moving .cd{filter:blur(2px)}
.stage.slow .cd{transition:left 2.2s ease-in-out,width 2.2s ease-in-out,filter .35s}
.stage.slow .cd .tt,.stage.slow .cd .meta{transition-duration:2.2s}
.stage.dragging .cd,.stage.dragging .cd .tt,.stage.dragging .cd .meta{transition:none}
.cd .th{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cd .shade{position:absolute;inset:0;background:linear-gradient(#0000 35%,rgba(0,0,0,.72));opacity:0;transition:opacity .3s}
.cd.hasimg{color:#fff}
.cd.hasimg:before{display:none}
.cd.hasimg .shade{opacity:1}
.cd .tipo{position:absolute;left:20px;top:20px;margin:0;border:2px solid currentColor;background:none;color:inherit;z-index:1}
.cd .cc{position:absolute;left:0;right:0;bottom:0;padding:22px 22px 24px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:1}
.cd{--fs-s:1.05rem;--fs-b:clamp(1.8rem,3.6vw,2.7rem)}
.cd .tt{font:900 1rem/1 var(--display);font-size:calc(var(--fs-s) + (var(--fs-b) - var(--fs-s)) * var(--k,0));text-transform:uppercase;letter-spacing:-.01em;transition:font-size .7s cubic-bezier(.65,.05,.25,1);overflow-wrap:break-word}
.cd .meta{font:500 .8rem/1.4 var(--display);font-size:calc(.8rem + .15rem * var(--k,0));opacity:.9;transition:font-size .7s cubic-bezier(.65,.05,.25,1)}
.cd .rm{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:0;border:0;background:none;color:inherit;font:800 .85rem var(--display);cursor:pointer;white-space:nowrap}
.cd .rm svg{width:22px;height:22px;flex:none}
.cd .rm:focus-visible{outline:3px solid currentColor;outline-offset:4px}
.c0{background:var(--rojo);color:#fff}.c1{background:#000;color:#fff}.c2{background:var(--gris);color:#000}.c3{background:#fff;color:var(--rojo)}
.ring{position:absolute;left:0;top:0;width:54px;height:54px;border:3px solid #fff;border-radius:30px;pointer-events:none;opacity:0;z-index:9;mix-blend-mode:difference;transition:width .25s,opacity .2s}
#vdlg{width:min(860px,calc(100% - 24px))}
.vp iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
@media (hover:hover) and (pointer:fine){.stage{cursor:none}.stage:hover .ring{opacity:1}.ring.drag{width:96px}}
@media (max-width:820px){.cd .cc{padding:16px 16px 18px}.cd .tipo{left:14px;top:14px}.cd{--fs-s:.85rem;--fs-b:1.6rem}}
@keyframes drift{0%,100%{transform:translate3d(-1.5px,.5px,0)}50%{transform:translate3d(1.5px,-1px,0)}}
.cd{animation:drift 7s ease-in-out infinite;animation-delay:calc(var(--j,0)*-1.7s)}
.stage.dragging .cd{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.cd{animation:none}.cd,.cd .tt{transition:none}#lanzamientos,#videoclips{transition:none}}
/* pie */
footer{background:var(--rojo);color:#fff;padding:48px 0}
footer .wrap{display:flex;flex-wrap:wrap;gap:24px 40px;align-items:center;justify-content:space-between}
footer .fl{height:96px}
footer .lg{display:block}
footer p{margin:0;font:800 1.2rem var(--display)}
footer p.cr{font:500 .95rem var(--display)}
footer a{font-weight:800}
.soc{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:12px}
.soc a{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border:3px solid #fff;text-decoration:none;font:800 .95rem var(--display)}
.soc svg{width:22px;height:22px;fill:currentColor;flex:none}
.soc a:hover{background:#fff;color:var(--rojo)}
.cf{flex:1 1 100%;max-width:640px;display:flex;flex-direction:column;gap:16px}
.cf h2{font-size:clamp(2rem,5vw,3rem);text-transform:uppercase;letter-spacing:-.01em}
.cf-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cf label{display:flex;flex-direction:column;gap:6px;font:800 .9rem var(--display)}
.cf input,.cf textarea{font:500 1rem var(--display);color:#000;background:#fff;border:3px solid #000;border-radius:0;padding:12px 14px;width:100%}
.cf textarea{resize:vertical;min-height:120px}
.cf input:focus-visible,.cf textarea:focus-visible{outline:3px solid #fff;outline-offset:2px}
.cf-foot{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.cf-btn{background:#000;color:#fff;border:3px solid #000;padding:12px 26px;font:800 1rem var(--display);cursor:pointer}
.cf-btn:hover{background:#fff;color:#000}
.cf-btn:disabled{opacity:.6;cursor:wait}
footer p.cf-msg{font:500 .95rem var(--display)}
@media (max-width:600px){.cf-row{grid-template-columns:1fr}}
@media (max-width:820px){.hero .mark{padding:100px 20px 28px}nav .l{display:none}.btn.alt{margin:10px 0 0}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
