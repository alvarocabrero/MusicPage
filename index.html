<!DOCTYPE html>
<html lang="es">
<!-- Arte Kills (artekills.com): web de una sola página, sin dependencias ni paso de compilación.
     Partes: cabecera fija, portada (último lanzamiento), Lanzamientos, Videoclips, Merch, tres pop ups y pie con
     el formulario de contacto. Los carruseles, los pop ups y la portada los rellena JavaScript (js/main.js) a partir
     de los datos de js/models/. Los textos de este HTML están en español y se traducen al arrancar según los
     atributos data-i18n (texto) y data-i18n-attr (atributos). Documentación: README.md y docs/. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arte Kills · Música</title>
<!-- Iconos: favicon (ICO y SVG), PNG de 192 px, icono de iOS y manifiesto (nombre e iconos al añadir la web a la
     pantalla de inicio). theme-color colorea la barra del navegador en el móvil con el rojo de la marca. -->
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#e22c14">
<!-- Buscadores: descripción (se traduce con el idioma) y dirección canónica de la página. -->
<meta name="description" content="Arte Kills: música, videoclips y merch. Escucha los últimos lanzamientos en Spotify, Bandcamp, YouTube, Apple Music y Tidal." data-i18n-attr="content:meta.description">
<link rel="canonical" href="https://artekills.com/">
<!-- Fuentes de Google: Raleway (títulos, menú, botones y datos) y Merriweather (textos largos). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;500;800;900&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
<!-- Hojas de estilo. El orden importa: ante dos reglas igual de específicas gana la de la hoja posterior
     (ajustes.css va la última a propósito). Qué hay en cada una: docs/estilos.md. -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/hero.css">
<link rel="stylesheet" href="css/sections.css">
<link rel="stylesheet" href="css/merch.css">
<link rel="stylesheet" href="css/dialogs.css">
<link rel="stylesheet" href="css/carousel.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/ajustes.css">
</head>
<body>
<!-- Cabecera fija. Empieza con .at-top (transparente y sin logotipo, sobre la portada); headerController la cambia
     al desplazarse. El botón #lang muestra el idioma al que se cambia y recarga la página en ese idioma. -->
<header class="top at-top" id="top-bar"><div class="wrap">
  <a href="#top" class="brand" data-i18n-attr="aria-label:brand.home" aria-label="Arte Kills, inicio">
    <img src="img/logotipo-horizontal.svg" width="757" height="176" alt="Arte Kills">
  </a>
  <nav><a href="#contacto" data-i18n="nav.contact">Contacto</a><button class="lang" id="lang" type="button" data-i18n="lang.label" data-i18n-attr="aria-label:lang.switch">EN</button></nav>
</div></header>

<main id="top">
<!-- Portada: logotipo grande y último lanzamiento (#hrel: el primer disco de releases.js). El bloque entre las marcas
     "portada" lo escribe tools/portada.mjs (no editarlo a mano) para que se vea sin esperar a JavaScript; al arrancar,
     heroView lo vuelve a pintar en el idioma de la visita y añade el reproductor de Spotify.
     El <h1> sólo lo leen los lectores de pantalla y los buscadores (clase .sr). -->
<div class="hero">
  <h1 class="sr">Arte Kills</h1>
  <div class="mark"><div class="mk">
    <img class="lg" src="img/logo-principal-vertical.svg" width="635" height="724" alt="Arte Kills">

  </div></div>
</div>

<!-- Secciones con carrusel (Lanzamientos, Videoclips, Merch), todas con la misma estructura:
     .hd con el título y el botón .vt "Ver lista" / "Ver carrusel"; la rayita .dash; y el carrusel .car con su
     escenario .stage (enfocable, para moverse con las flechas). Las tarjetas las crea carouselView dentro del
     escenario y la vista de lista (.lst) se añade al final de .car. -->
<section id="lanzamientos"><div class="wrap">
  <div class="hd"><h2 data-i18n="sec.releases">Lanzamientos</h2><button class="vt" type="button" data-i18n-attr="aria-label:viewAll;title:viewAll" aria-label="Ver lista" title="Ver lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg></button></div>
  <span class="dash"></span>
  <div class="car" id="car-rel" role="region" aria-roledescription="carousel" aria-label="Lanzamientos" data-i18n-attr="aria-roledescription:carousel;aria-label:sec.releases">
    <div class="stage" tabindex="0"></div>
  </div>
</div></section>

<!-- Videoclips: el carrusel abre el pop up de vídeo; en la vista de lista los vídeos se reproducen en la propia fila. -->
<section id="videoclips"><div class="wrap">
  <div class="hd"><h2 data-i18n="sec.videos">Videoclips</h2><button class="vt" type="button" data-i18n-attr="aria-label:viewAll;title:viewAll" aria-label="Ver lista" title="Ver lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg></button></div>
  <span class="dash"></span>
  <div class="car" id="car-vid" role="region" aria-roledescription="carousel" aria-label="Videoclips" data-i18n-attr="aria-roledescription:carousel;aria-label:sec.videos">
    <div class="stage" tabindex="0"></div>
  </div>
</div></section>
<!-- Merch: el carrusel y la lista abren el pop up de producto. -->
<section id="merch"><div class="wrap">
  <div class="hd"><h2 data-i18n="sec.merch">Merch</h2><button class="vt" type="button" data-i18n-attr="aria-label:viewAll;title:viewAll" aria-label="Ver lista" title="Ver lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg></button></div>
  <span class="dash"></span>
  <div class="car" id="car-merch" role="region" aria-roledescription="carousel" aria-label="Merch" data-i18n-attr="aria-roledescription:carousel;aria-label:sec.merch">
    <div class="stage" tabindex="0"></div>
  </div>
</div></section>
</main>

<!-- Pop ups (<dialog>): se abren como modales y su contenido lo pone la vista correspondiente al abrirlos.
     Estructura común: caja .dbox con cabecera .dh (título, datos y botón de cerrar) y contenido; y las flechas
     ‹ › (anterior/siguiente), fuera de la caja. -->
<!-- Disco: preescucha de Spotify (#dpv) y botones de plataformas (#dpl). -->
<dialog id="dlg" aria-labelledby="dt">
  <div class="dbox">
    <div class="dh"><div><h3 id="dt"></h3><p id="dm"></p></div><button class="dx" id="dx" aria-label="Cerrar" data-i18n-attr="aria-label:dlg.close">×</button></div>
    <div class="dp" id="dpv"></div>
    <ul class="plats" id="dpl"></ul>
  </div>
  <button class="nv nv-p" id="dprev" aria-label="Anterior" data-i18n-attr="aria-label:dlg.prev">‹</button><button class="nv nv-n" id="dnext" aria-label="Siguiente" data-i18n-attr="aria-label:dlg.next">›</button>
</dialog>

<!-- Vídeo: reproductor de YouTube (#vpv). -->
<dialog id="vdlg" aria-labelledby="vtt">
  <div class="dbox">
    <div class="dh"><div><h3 id="vtt"></h3></div><button class="dx" id="vdx" aria-label="Cerrar" data-i18n-attr="aria-label:dlg.close">×</button></div>
    <div class="vp" id="vpv"></div>
  </div>
  <button class="nv nv-p" id="vprev" aria-label="Anterior" data-i18n-attr="aria-label:dlg.prev">‹</button><button class="nv nv-n" id="vnext" aria-label="Siguiente" data-i18n-attr="aria-label:dlg.next">›</button>
</dialog>

<!-- Producto: fotos, descripción, envíos y botón de compra (#mbody). -->
<dialog id="mdlg" aria-labelledby="mt">
  <div class="dbox">
    <div class="dh"><div><h3 id="mt"></h3><p id="mm"></p></div><button class="dx" id="mx" aria-label="Cerrar" data-i18n-attr="aria-label:dlg.close">×</button></div>
    <div class="mb" id="mbody"></div>
  </div>
  <button class="nv nv-p" id="mprev" aria-label="Anterior" data-i18n-attr="aria-label:dlg.prev">‹</button><button class="nv nv-n" id="mnext" aria-label="Siguiente" data-i18n-attr="aria-label:dlg.next">›</button>
</dialog>

<!-- Pie (#contacto, destino del enlace "Contacto"): formulario, logotipo, redes y copyright.
     El formulario funciona también sin JavaScript (envío normal a FormSubmit); con JavaScript se envía sin
     recargar la página y el resultado aparece en #cf-msg (ver contactController). -->
<footer id="contacto"><div class="wrap">
  <form class="cf" id="cf" action="https://formsubmit.co/kbrekills@gmail.com" method="POST">
    <h2 data-i18n="contact.title">Contacto</h2>
    <div class="cf-row">
      <label><span data-i18n="contact.name">Nombre</span><input type="text" name="name" autocomplete="name" required></label>
      <label><span data-i18n="contact.email">Email</span><input type="email" name="email" autocomplete="email" required></label>
    </div>
    <label><span data-i18n="contact.message">Mensaje</span><textarea name="message" rows="5" required></textarea></label>
    <!-- Campos de FormSubmit: _honey es una trampa para bots (oculta; si llega rellena, el mensaje se descarta),
         _subject el asunto del correo (se traduce), _captcha desactiva su página de verificación y _template
         da formato de tabla al correo. -->
    <input type="text" name="_honey" tabindex="-1" autocomplete="off" style="display:none">
    <input type="hidden" name="_subject" value="Nuevo mensaje desde la web de Arte Kills" data-i18n-attr="value:contact.subject">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">
    <div class="cf-foot"><button class="cf-btn" type="submit" data-i18n="contact.send">Enviar mensaje</button><p class="cf-msg" id="cf-msg" role="status" aria-live="polite"></p></div>
  </form>
  <!-- Logotipo del pie: símbolo #lfn del sprite img/sprite.svg; la variable r del atributo style es su proporción
       ancho/alto (ver .lg en base.css). -->
  <div class="fl"><svg class="lg" style="--r:1.8780" viewBox="0 0 692.42 368.7" role="img" aria-label="Arte Kills"><use href="img/sprite.svg#lfn"/></svg></div>
  <ul class="soc">
    <li><a href="https://www.instagram.com/artekills/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.0301.084c-1.2768.0602-2.1487.264-2.911.5634-.7888.3075-1.4575.72-2.1228 1.3877-.6652.6677-1.075 1.3368-1.3802 2.127-.2954.7638-.4956 1.6365-.552 2.914-.0564 1.2775-.0689 1.6882-.0626 4.947.0062 3.2586.0206 3.6671.0825 4.9473.061 1.2765.264 2.1482.5635 2.9107.308.7889.72 1.4573 1.388 2.1228.6679.6655 1.3365 1.0743 2.1285 1.38.7632.295 1.6361.4961 2.9134.552 1.2773.056 1.6884.069 4.9462.0627 3.2578-.0062 3.668-.0207 4.9478-.0814 1.28-.0607 2.147-.2652 2.9098-.5633.7889-.3086 1.4578-.72 2.1228-1.3881.665-.6682 1.0745-1.3378 1.3795-2.1284.2957-.7632.4966-1.636.552-2.9124.056-1.2809.0692-1.6898.063-4.948-.0063-3.2583-.021-3.6668-.0817-4.9465-.0607-1.2797-.264-2.1487-.5633-2.9117-.3084-.7889-.72-1.4568-1.3876-2.1228C21.2982 1.33 20.628.9208 19.8378.6165 19.074.321 18.2017.1197 16.9244.0645 15.6471.0093 15.236-.005 11.977.0014 8.718.0076 8.31.0215 7.0301.0839m.1402 21.6932c-1.17-.0509-1.8053-.2453-2.2287-.408-.5606-.216-.96-.4771-1.3819-.895-.422-.4178-.6811-.8186-.9-1.378-.1644-.4234-.3624-1.058-.4171-2.228-.0595-1.2645-.072-1.6442-.079-4.848-.007-3.2037.0053-3.583.0607-4.848.05-1.169.2456-1.805.408-2.2282.216-.5613.4762-.96.895-1.3816.4188-.4217.8184-.6814 1.3783-.9003.423-.1651 1.0575-.3614 2.227-.4171 1.2655-.06 1.6447-.072 4.848-.079 3.2033-.007 3.5835.005 4.8495.0608 1.169.0508 1.8053.2445 2.228.408.5608.216.96.4754 1.3816.895.4217.4194.6816.8176.9005 1.3787.1653.4217.3617 1.056.4169 2.2263.0602 1.2655.0739 1.645.0796 4.848.0058 3.203-.0055 3.5834-.061 4.848-.051 1.17-.245 1.8055-.408 2.2294-.216.5604-.4763.96-.8954 1.3814-.419.4215-.8181.6811-1.3783.9-.4224.1649-1.0577.3617-2.2262.4174-1.2656.0595-1.6448.072-4.8493.079-3.2045.007-3.5825-.006-4.848-.0608M16.953 5.5864A1.44 1.44 0 1 0 18.39 4.144a1.44 1.44 0 0 0-1.437 1.4424M5.8385 12.012c.0067 3.4032 2.7706 6.1557 6.173 6.1493 3.4026-.0065 6.157-2.7701 6.1506-6.1733-.0065-3.403     <li><a href="https://artekills.bandcamp.com" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M0 18.75l7.437-13.5H24l-7.438 13.5H0z"/></svg>Bandcamp</a></li>
  </ul>
  <p class="cr">© 2026 Arte Kills</p>
</div></footer>

<!-- JavaScript: módulo ES (se ejecuta cuando el HTML ya está leído). Punto de entrada: js/main.js. -->
<script type="module" src="js/main.js"></script>
</body>
</html>
